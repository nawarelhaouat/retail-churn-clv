version: 2

models:
  - name: stg_online_retail
    description: "Cleaned invoice lines: typed, deduplicated, non-sales rows removed."
    columns:
      - name: sales_line_id
        description: "Hash of all source columns; unique per line after deduplication."
        tests:
          - unique
          - not_null
      - name: invoice_no
        tests: [not_null]
      - name: stock_code
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: invoice_ts
        tests: [not_null]
      - name: country
        tests: [not_null]